<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="80" viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">
  <!-- 다이아몬드 큐브 텍스처 (레벨 3) -->

  <defs>
    <linearGradient id="diamondGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00BFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="diamondLeftSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:0.8" />
    </linearGradient>

    <linearGradient id="diamondRightSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4682B4;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- 좌측면 -->
  <polygon points="16,16 32,24 32,72 16,64"
           fill="url(#diamondLeftSide)"
           stroke="#1E90FF"
           stroke-width="1"/>

  <!-- 우측면 -->
  <polygon points="32,24 48,16 48,64 32,72"
           fill="url(#diamondRightSide)"
           stroke="#4682B4"
           stroke-width="1"/>

  <!-- 상단면 (다이아몬드) -->
  <polygon points="32,8 48,16 32,24 16,16"
           fill="url(#diamondGradient)"
           stroke="#4169E1"
           stroke-width="2"/>

  <!-- 크리스탈 반사 효과 -->
  <polygon points="28,12 36,12 40,16 32,16"
           fill="#FFFFFF"
           opacity="0.6"/>

  <!-- 반짝임 효과 -->
  <circle cx="26" cy="14" r="1" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="38" cy="18" r="0.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="34" cy="12" r="0.3" fill="#FFFFFF" opacity="0.5"/>
</svg>
