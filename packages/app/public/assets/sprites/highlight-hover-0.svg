<svg width="64" height="32" viewBox="0 0 64 32" xmlns="http://www.w3.org/2000/svg">
  <!-- 레벨 0 바닥 호버 하이라이트 - 꽉 찬 마름모에 맞춰 조정 -->
  <defs>
    <!-- 호버 하이라이트 그라데이션 (녹색) -->
    <linearGradient id="hoverHighlightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#2ecc71;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- 아이소메트릭 바닥 하이라이트 (꽉 찬 다이아몬드 모양) -->
  <path d="M 32 0 L 64 16 L 32 32 L 0 16 Z"
        fill="none"
        stroke="url(#hoverHighlightGradient)"
        stroke-width="2"
        opacity="0.7"/>

  <!-- 내부 하이라이트 효과 -->
  <path d="M 32 4 L 58 16 L 32 28 L 6 16 Z"
        fill="none"
        stroke="#00ff00"
        stroke-width="1"
        opacity="0.4"/>
</svg>